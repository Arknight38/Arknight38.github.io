<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Redirecting — Saku Grossarth</title>
    <script>
      location.replace(
        "/?portfolio-route=" +
          encodeURIComponent(
            location.pathname + location.search + location.hash,
          ),
      );
    </script>
  </head>
  <body>
    <a href="/">Return to portfolio</a>
  </body>
</html>
